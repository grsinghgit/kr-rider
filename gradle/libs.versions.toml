[versions]
# Android Gradle Plugin & Kotlin
agp = "8.5.2"
kotlin = "2.1.0"

# AndroidX Core
coreKtx = "1.12.0"
appcompat = "1.6.1"
material = "1.11.0"
activity = "1.8.2"
constraintlayout = "2.1.4"

# Navigation
navigationFragmentKtx = "2.7.7"
navigationUiKtx = "2.7.7"

# Lifecycle (ViewModel + LiveData)
lifecycle = "2.8.7"
places = "4.3.1"

# Coroutines
coroutines = "1.7.3"
# Razorpay
razorpay = "1.6.40"

# Firebase (BOM)
firebaseBom = "33.6.0"

# Google Play Services (Maps + Location)
playServicesMaps = "19.0.0"
playServicesLocation = "21.3.0"
androidMapsUtils = "3.8.2"

# Networking (Retrofit + OkHttp)
retrofit = "2.11.0"
okhttp = "4.12.0"

# Image Loading
glide = "4.16.0"

# Testing
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

[libraries]
# ✅ Add Razorpay library
razorpay-checkout = { module = "com.razorpay:checkout", version.ref = "razorpay" }
# ============================================================
# 1. AndroidX Core Libraries
# ============================================================
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# ============================================================
# 2. Navigation Component
# ============================================================
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigationFragmentKtx" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigationUiKtx" }

# ============================================================
# 3. Lifecycle (ViewModel + LiveData)
# ============================================================
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

# ============================================================
# 4. Coroutines (Background Threads)
# ============================================================
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# ============================================================
# 5. Firebase (Authentication + Firestore + Storage + Messaging)
# ============================================================
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth-ktx = { group = "com.google.firebase", name = "firebase-auth-ktx" }
firebase-firestore-ktx = { group = "com.google.firebase", name = "firebase-firestore-ktx" }
firebase-storage-ktx = { group = "com.google.firebase", name = "firebase-storage-ktx" }
firebase-messaging-ktx = { group = "com.google.firebase", name = "firebase-messaging-ktx" }

# ============================================================
# 6. Google Play Services (Maps + Location)
# ============================================================
places = { group = "com.google.android.libraries.places", name = "places", version.ref = "places" }
play-services-maps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "playServicesMaps" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
android-maps-utils = { group = "com.google.maps.android", name = "android-maps-utils", version.ref = "androidMapsUtils" }

# ============================================================
# 7. Networking (Retrofit + OkHttp)
# ============================================================
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# ============================================================
# 8. Image Loading (Glide)
# ============================================================
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }

# ============================================================
# 9. Testing
# ============================================================
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
